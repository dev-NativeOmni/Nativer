<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 450" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="twilight-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050a18" />
      <stop offset="50%" stop-color="#0e1e3e" />
      <stop offset="85%" stop-color="#1e2c4f" />
      <stop offset="100%" stop-color="#3b3353" />
    </linearGradient>
    <linearGradient id="water-reflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a2e" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="overlay-tint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060913" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#0a1228" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#060913" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="350" fill="url(#twilight-sky)" />

  <!-- City Skyline Silhouettes with glowing windows -->
  <g fill="#0b1224">
    <!-- CN Tower / Iconic Needle Spire -->
    <rect x="1150" y="40" width="4" height="260" fill="#cbd5e1" />
    <circle cx="1152" cy="120" r="14" fill="#1e293b" />
    <rect x="1146" y="116" width="12" height="8" rx="2" fill="#38bdf8" />
    <circle cx="1152" cy="40" r="3" fill="#ef4444" />

    <!-- Skyscrapers -->
    <rect x="200" y="160" width="70" height="150" />
    <rect x="290" y="120" width="90" height="190" />
    <rect x="400" y="180" width="60" height="130" />
    <rect x="480" y="90" width="105" height="220" />
    <polygon points="480,90 532,45 585,90" fill="#0f172a" />
    
    <rect x="610" y="140" width="85" height="170" />
    <rect x="720" y="100" width="110" height="210" />
    <rect x="850" y="170" width="75" height="140" />
    <rect x="950" y="130" width="95" height="180" />
    <rect x="1070" y="110" width="130" height="200" />
    <rect x="1220" y="150" width="80" height="160" />
    <rect x="1320" y="180" width="120" height="130" />
  </g>

  <!-- Windows Grid Glowing (Golden & Cyan) -->
  <g fill="#fef08a" opacity="0.6">
    <circle cx="310" cy="150" r="2" /><circle cx="330" cy="150" r="2" /><circle cx="350" cy="150" r="2" />
    <circle cx="310" cy="180" r="2" /><circle cx="330" cy="180" r="2" /><circle cx="350" cy="180" r="2" />
    <circle cx="500" cy="120" r="2" /><circle cx="530" cy="120" r="2" /><circle cx="560" cy="120" r="2" />
    <circle cx="500" cy="150" r="2" /><circle cx="530" cy="150" r="2" /><circle cx="560" cy="150" r="2" />
    <circle cx="740" cy="140" r="2" /><circle cx="770" cy="140" r="2" /><circle cx="800" cy="140" r="2" />
    <circle cx="740" cy="170" r="2" /><circle cx="770" cy="170" r="2" /><circle cx="800" cy="170" r="2" />
    <circle cx="980" cy="160" r="2" /><circle cx="1010" cy="160" r="2" /><circle cx="1090" cy="140" r="2" />
  </g>

  <!-- Water Reflection at Bottom -->
  <rect y="310" width="1600" height="140" fill="url(#water-reflect)" />

  <!-- Dark Atmospheric Tint for Clean Text Readability -->
  <rect width="1600" height="450" fill="url(#overlay-tint)" />
</svg>
