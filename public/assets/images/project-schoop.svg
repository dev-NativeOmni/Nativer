    <rect x="22" y="128" width="160" height="8" rx="4" fill="#10b981" />
    <text x="22" y="156" fill="#34d399" font-size="10" font-family="sans-serif">92% Aktif Setoran</text>
    <rect x="22" y="178" width="186" height="32" rx="6" fill="#1e1b38" />
    <text x="115" y="198" fill="#e2e8f0" font-size="10" text-anchor="middle">Portal Wali Murid</text>
