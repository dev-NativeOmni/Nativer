      <stop offset="0%" stop-color="#130f26" />
      <stop offset="100%" stop-color="#070914" />
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg-schoop)" rx="12" />

  <!-- Browser Top Bar -->
  <rect width="800" height="38" fill="#141129" rx="12" />
  <circle cx="24" cy="19" r="6" fill="#ef4444" />
  <circle cx="44" cy="19" r="6" fill="#f59e0b" />
  <circle cx="64" cy="19" r="6" fill="#10b981" />
  <rect x="230" y="10" width="340" height="18" rx="9" fill="#1e1b38" />
  <text x="400" y="23" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">hafizplus-school-platform.vercel.app</text>

  <!-- Hero Portal Banner -->
  <g transform="translate(36, 56)">
    <rect width="728" height="140" rx="10" fill="#1b1636" stroke="#31285c" />
    <rect x="24" y="24" width="110" height="22" rx="11" fill="url(#purple-grad)" opacity="0.25" />
    <text x="79" y="39" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">HAFIZPLUS 3.0</text>
    <text x="24" y="76" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">Schoop Education Platform</text>
    <text x="24" y="100" fill="#94a3b8" font-family="sans-serif" font-size="12">Portal Akademik Terpadu • Monitoring Yayasan &amp; Capaian Santri</text>

    <!-- Live Status Pill -->
    <rect x="570" y="24" width="134" height="32" rx="16" fill="url(#purple-grad)" />
    <text x="637" y="44" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Portal Yayasan ↗</text>
  </g>

  <!-- 3 Portal Module Cards -->
  <g transform="translate(36, 214)">
