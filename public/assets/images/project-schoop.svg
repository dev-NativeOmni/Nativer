  <g transform="translate(534, 214)">
    <rect width="230" height="230" rx="10" fill="#121024" stroke="#28224a" />
    <circle cx="38" cy="38" r="16" fill="#10b981" opacity="0.2" />
    <text x="38" y="43" fill="#34d399" font-size="14" text-anchor="middle">🌟</text>
    <text x="22" y="82" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">HafizPlus Tracker</text>
    <text x="22" y="102" fill="#94a3b8" font-size="10" font-family="sans-serif">Rekap hafalan &amp; mutabaah harian</text>
