    <text x="38" y="43" fill="#c084fc" font-size="14" text-anchor="middle">📚</text>
    <text x="22" y="82" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">Akademik &amp; Kurikulum</text>
    <text x="22" y="102" fill="#94a3b8" font-size="10" font-family="sans-serif">Manajemen kelas, jadwal &amp; nilai</text>
    <rect x="22" y="128" width="186" height="8" rx="4" fill="#1e1b38" />
    <rect x="22" y="128" width="150" height="8" rx="4" fill="#a855f7" />
    <text x="22" y="156" fill="#c084fc" font-size="10" font-family="sans-serif">84% Semester Target</text>
    <rect x="22" y="178" width="186" height="32" rx="6" fill="#1e1b38" />
    <text x="115" y="198" fill="#e2e8f0" font-size="10" text-anchor="middle">Buka Modul Rapor</text>
  </g>

  <g transform="translate(285, 214)">
    <rect width="230" height="230" rx="10" fill="#121024" stroke="#28224a" />
    <circle cx="38" cy="38" r="16" fill="#38bdf8" opacity="0.2" />
    <text x="38" y="43" fill="#38bdf8" font-size="14" text-anchor="middle">🏫</text>
    <text x="22" y="82" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">Multi-Unit Yayasan</text>
    <text x="22" y="102" fill="#94a3b8" font-size="10" font-family="sans-serif">Monitoring SD, SMP, hingga SMA</text>
