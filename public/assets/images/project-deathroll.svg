<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="punk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140608" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="red-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#punk-bg)" rx="12" />

  <!-- Browser Header -->
  <rect width="800" height="38" fill="#18181b" rx="12" />
  <circle cx="24" cy="19" r="6" fill="#ef4444" />
  <circle cx="44" cy="19" r="6" fill="#f59e0b" />
  <circle cx="64" cy="19" r="6" fill="#10b981" />
  <rect x="250" y="10" width="300" height="18" rx="9" fill="#27272a" />
  <text x="400" y="23" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">deathroll.band / tour-gigs</text>

  <!-- Big Hero Punk Banner -->
  <g transform="translate(30, 55)">
    <rect width="740" height="230" rx="8" fill="#111113" stroke="#27272a" />
    <path d="M 0 0 L 250 0 L 180 230 L 0 230 Z" fill="#22070a" opacity="0.6" />
    
    <!-- Title -->
    <text x="40" y="75" fill="#f43f5e" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" letter-spacing="2">DEATHROLL</text>
    <text x="40" y="105" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">INDONESIAN PUNK ROCK &amp; TOUR 2026</text>
    <text x="40" y="132" fill="#a1a1aa" font-family="sans-serif" font-size="12">Live Gigs • High-Voltage Distortion • In-Place Lightweight CMS</text>

    <!-- Tape Badge -->
    <rect x="40" y="155" width="140" height="32" rx="4" fill="url(#red-neon)" />
    <text x="110" y="176" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">GET TICKETS →</text>

    <rect x="195" y="155" width="130" height="32" rx="4" fill="#27272a" stroke="#3f3f46" />
    <text x="260" y="176" fill="#e4e4e7" font-family="sans-serif" font-size="12" text-anchor="middle">DISCOGRAPHY</text>

    <!-- Vinyl Album Mockup on Right -->
    <circle cx="610" cy="115" r="85" fill="#09090b" stroke="#3f3f46" stroke-width="4" />
    <circle cx="610" cy="115" r="70" fill="#18181b" stroke="#27272a" stroke-width="2" />
    <circle cx="610" cy="115" r="35" fill="url(#red-neon)" />
    <circle cx="610" cy="115" r="10" fill="#09090b" />
  </g>

  <!-- Interactive Synthesizer Audio Player Bar -->
  <g transform="translate(30, 305)">
    <rect width="740" height="70" rx="8" fill="#18181b" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="45" cy="35" r="20" fill="url(#red-neon)" />
    <polygon points="40,25 55,35 40,45" fill="#ffffff" />
    
    <text x="80" y="30" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="bold">Track 01 — Distorsi Tanpa Batas (Web Audio Synthesizer)</text>
    <text x="80" y="48" fill="#71717a" font-size="10" font-family="sans-serif">Live Sound Generator (60 FPS WebGL Audio Spectrum)</text>

    <!-- Audio Waveform -->
    <path d="M 450 35 Q 460 15, 470 35 T 490 35 T 510 35 T 530 35 T 550 35 T 570 35 T 590 35 T 610 35 T 630 35 T 650 35 T 670 35 T 690 35" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Tour Gigs Pills -->
  <g transform="translate(30, 395)">
    <rect width="235" height="60" rx="6" fill="#111113" stroke="#27272a" />
    <text x="16" y="26" fill="#f43f5e" font-size="10" font-weight="bold">SOLO • JATENG</text>
    <text x="16" y="44" fill="#ffffff" font-size="12">Hall Kesenian Gigs</text>
    <rect x="165" y="16" width="55" height="20" rx="3" fill="#052e16" />
    <text x="192" y="30" fill="#4ade80" font-size="9" text-anchor="middle">ONLINE</text>
  </g>
  <g transform="translate(282, 395)">
    <rect width="235" height="60" rx="6" fill="#111113" stroke="#27272a" />
    <text x="16" y="26" fill="#38bdf8" font-size="10" font-weight="bold">JOGJA • DIY</text>
    <text x="16" y="44" fill="#ffffff" font-size="12">Stadium Rock Fest</text>
    <rect x="165" y="16" width="55" height="20" rx="3" fill="#450a0a" />
    <text x="192" y="30" fill="#f87171" font-size="9" text-anchor="middle">SOLD OUT</text>
  </g>
  <g transform="translate(535, 395)">
    <rect width="235" height="60" rx="6" fill="#111113" stroke="#27272a" />
    <text x="16" y="26" fill="#eab308" font-size="10" font-weight="bold">JAKARTA</text>
    <text x="16" y="44" fill="#ffffff" font-size="12">Underground Stage</text>
    <rect x="165" y="16" width="55" height="20" rx="3" fill="#052e16" />
    <text x="192" y="30" fill="#4ade80" font-size="9" text-anchor="middle">ONLINE</text>
  </g>
</svg>
