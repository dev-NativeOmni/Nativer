<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <radialGradient id="face-skin" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </radialGradient>
    <linearGradient id="hoodie-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Halo -->
  <circle cx="300" cy="350" r="240" fill="url(#avatar-glow)" filter="url(#soft-shadow)" />

  <!-- Developer Character Vector Art -->
  <g id="developer-character" filter="url(#soft-shadow)">
    <!-- Hoodie Shoulders & Chest -->
    <path d="M 120 700 C 130 520, 190 440, 240 430 L 360 430 C 410 440, 470 520, 480 700 Z" fill="url(#hoodie-grad)" />
    <!-- Hoodie Fold / Zipper / Collar -->
    <path d="M 230 430 C 270 480, 330 480, 370 430 L 390 530 L 300 560 L 210 530 Z" fill="#1e293b" />
    <path d="M 255 435 C 285 470, 315 470, 345 435 L 340 500 C 315 520, 285 520, 260 500 Z" fill="#0f172a" />
    <line x1="300" y1="520" x2="300" y2="700" stroke="#334155" stroke-width="2" />
    <!-- Crossed Arms Silhouette -->
    <path d="M 170 560 C 220 540, 380 540, 430 560 C 420 640, 380 670, 300 670 C 220 670, 180 640, 170 560 Z" fill="#141c2e" stroke="#2563eb" stroke-opacity="0.3" stroke-width="2" />

    <!-- Neck -->
    <path d="M 265 370 L 335 370 L 340 440 L 260 440 Z" fill="#e2a053" />
    <path d="M 265 400 C 290 425, 310 425, 335 400 L 340 440 L 260 440 Z" fill="#c88338" opacity="0.6" />

    <!-- Head & Face -->
    <ellipse cx="300" cy="270" rx="90" ry="110" fill="#f6b876" />
    <path d="M 210 270 C 210 360, 240 395, 300 395 C 360 395, 390 360, 390 270 Z" fill="#e9a45e" />

    <!-- Stylish Beard / Stubble -->
    <path d="M 220 280 C 220 375, 255 400, 300 400 C 345 400, 380 375, 380 280 C 370 340, 330 380, 300 380 C 270 380, 230 340, 220 280 Z" fill="#382923" />
    <path d="M 275 348 C 290 356, 310 356, 325 348 C 315 354, 285 354, 275 348 Z" fill="#2d1f1a" />

    <!-- Hair -->
    <path d="M 200 240 C 195 140, 260 120, 300 120 C 360 120, 405 145, 400 240 C 385 200, 350 170, 300 170 C 245 170, 215 205, 200 240 Z" fill="#261b17" />
    <path d="M 220 180 C 270 120, 340 130, 380 160 C 350 140, 290 145, 240 180 Z" fill="#3b2b24" />

    <!-- Ears -->
    <ellipse cx="205" cy="275" rx="14" ry="22" fill="#e9a45e" />
    <ellipse cx="395" cy="275" rx="14" ry="22" fill="#e9a45e" />

    <!-- Eyes & Eyebrows -->
    <path d="M 240 228 Q 260 220, 280 228" stroke="#261b17" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M 320 228 Q 340 220, 360 228" stroke="#261b17" stroke-width="5" fill="none" stroke-linecap="round" />
    
    <circle cx="260" cy="248" r="8" fill="#ffffff" />
    <circle cx="260" cy="248" r="5" fill="#3b2618" />
    <circle cx="262" cy="246" r="2" fill="#ffffff" />

    <circle cx="340" cy="248" r="8" fill="#ffffff" />
    <circle cx="340" cy="248" r="5" fill="#3b2618" />
    <circle cx="342" cy="246" r="2" fill="#ffffff" />

    <!-- Nose & Smile -->
    <path d="M 300 245 L 295 285 L 305 285 Z" fill="#d98943" />
    <path d="M 280 315 Q 300 330, 320 315" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Modern Designer Glasses (Black Frames like in photo) -->
    <rect x="230" y="230" width="60" height="42" rx="10" fill="rgba(56, 189, 248, 0.15)" stroke="#0f172a" stroke-width="5" />
    <rect x="310" y="230" width="60" height="42" rx="10" fill="rgba(56, 189, 248, 0.15)" stroke="#0f172a" stroke-width="5" />
    <!-- Glasses Bridge -->
    <path d="M 290 244 Q 300 240, 310 244" stroke="#0f172a" stroke-width="5" fill="none" />
    <!-- Glasses Temples -->
    <line x1="230" y1="240" x2="208" y2="248" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    <line x1="370" y1="240" x2="392" y2="248" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Floating Tech Badges around avatar -->
  <g transform="translate(60, 240)" filter="url(#soft-shadow)">
    <rect width="130" height="42" rx="21" fill="#0b1329" stroke="#2563eb" stroke-width="1.5" />
    <circle cx="22" cy="21" r="12" fill="#2563eb" />
    <text x="22" y="26" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">⚡</text>
    <text x="42" y="25" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="bold">Full Stack</text>
  </g>

  <g transform="translate(410, 360)" filter="url(#soft-shadow)">
    <rect width="145" height="42" rx="21" fill="#0b1329" stroke="#10b981" stroke-width="1.5" />
    <circle cx="22" cy="21" r="12" fill="#10b981" />
    <text x="22" y="26" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">✓</text>
    <text x="42" y="25" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="bold">11+ Repos Live</text>
  </g>
</svg>
