<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-nativer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071226" />
      <stop offset="100%" stop-color="#040712" />
    </linearGradient>
    <linearGradient id="nat-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0084ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg-nativer)" rx="12" />

  <!-- Browser Bar -->
  <rect width="800" height="38" fill="#0b1326" rx="12" />
  <circle cx="24" cy="19" r="6" fill="#ef4444" />
  <circle cx="44" cy="19" r="6" fill="#f59e0b" />
  <circle cx="64" cy="19" r="6" fill="#10b981" />
  <rect x="250" y="10" width="300" height="18" rx="9" fill="#14203b" />
  <text x="400" y="23" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">https://native.web.id</text>

  <!-- Mini Alpine Mountain Background -->
  <polygon points="0,280 120,170 250,235 420,130 580,220 710,150 800,210 800,480 0,480" fill="#0d1b38" opacity="0.8" />
  <polygon points="0,330 160,240 340,300 520,210 680,290 800,245 800,480 0,480" fill="#070e1f" />

  <!-- Three.js Stardust Particles -->
  <g fill="#60a5fa" opacity="0.8">
    <circle cx="110" cy="95" r="2.5" /><circle cx="230" cy="70" r="1.8" />
    <circle cx="380" cy="90" r="2" /><circle cx="520" cy="65" r="2.5" />
    <circle cx="670" cy="105" r="1.5" /><circle cx="740" cy="80" r="2" />
    <circle cx="460" cy="150" r="1.8" /><circle cx="610" cy="180" r="2.2" />
  </g>

  <!-- Left Content Preview -->
  <text x="56" y="135" fill="#38bdf8" font-size="13" font-weight="bold" font-family="sans-serif">Hello, I'm</text>
  <text x="56" y="182" fill="#ffffff" font-size="40" font-weight="800" font-family="sans-serif">Native Omni</text>
  <text x="56" y="218" fill="#cbd5e1" font-size="24" font-weight="bold" font-family="sans-serif">Full Stack Developer</text>
  <rect x="56" y="246" width="130" height="34" rx="17" fill="url(#nat-blue)" />
  <text x="121" y="267" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">View My Work →</text>
  <rect x="198" y="246" width="115" height="34" rx="17" fill="#0f172a" stroke="#334155" />
  <text x="255" y="267" fill="#e2e8f0" font-size="11" text-anchor="middle">Contact Me</text>

  <!-- Right 3D Wireframe Ring + Avatar Silhouette -->
  <g transform="translate(590, 235)">
    <circle cx="0" cy="0" r="105" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 4" />
    <circle cx="0" cy="0" r="82" fill="url(#nat-blue)" opacity="0.15" />
    <circle cx="0" cy="-18" r="34" fill="#334155" stroke="#38bdf8" stroke-width="2" />
    <path d="M -52 70 C -48 25, 48 25, 52 70 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <rect x="-58" y="55" width="116" height="24" rx="12" fill="#0084ff" />
    <text x="0" y="71" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">Three.js + Vite 6</text>
  </g>
</svg>
