<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Ghazeef</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 20%, rgba(0, 132, 255, 0.16), transparent 55%), #050814;
      color: #f8fafc;
      text-align: center;
    }
    .card {
      max-width: 480px;
      width: 100%;
      padding: 2.5rem 2rem;
      border-radius: 18px;
      background: rgba(12, 18, 36, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }
    .code {
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #38bdf8, #0084ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.75rem; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.75rem; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      background: #0084ff;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    a:hover { background: #0070d8; transform: translateY(-2px); }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for doesn't exist or has been moved. Return to the main portfolio to explore my projects.</p>
    <a href="/">← Back to Ghazeef</a>
  </main>
</body>
</html>
